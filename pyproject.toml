[project]
name = "openapi-drift-radar"
version = "0.1.0"
description = "OpenAPI Drift Radar: find every docs line an API change makes stale, cite it, and draft the fix."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "pydantic>=2.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]

[project.scripts]
drift-radar = "radar.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar", "server"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
